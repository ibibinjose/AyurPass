name: Production Readiness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-documents:
    name: Validate production readiness documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate checklist structure and source notes
        run: bash ./scripts/check-production-readiness.sh
