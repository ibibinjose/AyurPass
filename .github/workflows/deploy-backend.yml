name: Deploy Backend to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ayurpass-backend
  ECS_CLUSTER: ayurpass
  ECS_SERVICE: ayurpass-api
  TASK_FAMILY: ayurpass-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        working-directory: apps/api
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t "$ECR_URI:$IMAGE_TAG" -t "$ECR_URI:latest" .
          docker push "$ECR_URI:$IMAGE_TAG"
          docker push "$ECR_URI:latest"

      - name: Register task definition with immutable image
        id: task-definition
        env:
          ECR_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          service_json="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")"
          task_definition_arn="$(echo "$service_json" | jq -r '.services[0].taskDefinition')"
          if [ -z "$task_definition_arn" ] || [ "$task_definition_arn" = "null" ]; then
            echo "The ECS service does not expose a current task definition." >&2
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$task_definition_arn" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' > task-definition.json

          container_name="$(jq -r --arg repository "/$ECR_REPOSITORY" '
            .containerDefinitions[]
            | select(.image | endswith($repository) or contains($repository + ":"))
            | .name
          ' task-definition.json | head -n1)"
          if [ -z "$container_name" ] || [ "$container_name" = "null" ]; then
            echo "Could not identify an ECS container using repository $ECR_REPOSITORY." >&2
            jq -r '.containerDefinitions[] | "container=\(.name) image=\(.image)"' task-definition.json >&2
            exit 1
          fi

          image="$ECR_URI:$IMAGE_TAG"
          jq --arg container "$container_name" --arg image "$image" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .placementConstraints,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .enableFaultInjection
            )
            | .containerDefinitions |= map(
                if .name == $container then .image = $image else . end
              )
          ' task-definition.json > task-definition-rendered.json

          new_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "task_definition=$new_task_definition" >> "$GITHUB_OUTPUT"
          echo "container_name=$container_name" >> "$GITHUB_OUTPUT"
          echo "Deploying task definition $new_task_definition with $container_name=$image"

      - name: Deploy immutable task definition
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.task_definition }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "ECS deployment is stable."

      - name: Diagnose ECS stabilization failure
        if: ${{ failure() }}
        run: |
          set +e
          echo "=== ECS service state ==="
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[*].{status:status,rolloutState:rolloutState,desired:desiredCount,running:runningCount,pending:pendingCount,failedTasks:failedTasks,taskDefinition:taskDefinition},events:events[0:10].[createdAt,message]}' \
            --output json || true

          echo "=== Recently stopped tasks ==="
          stopped_tasks="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --region "$AWS_REGION" \
            --query 'taskArns[0:10]' \
            --output text || true)"
          if [ -n "$stopped_tasks" ]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks $stopped_tasks \
              --region "$AWS_REGION" \
              --query 'tasks[].{taskArn:taskArn,lastStatus:lastStatus,stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,healthStatus:healthStatus}}' \
              --output json || true
          else
            echo "No stopped ECS tasks were returned for this service."
          fi

          echo "=== Current task definition images ==="
          aws ecs describe-task-definition \
            --task-definition "${{ steps.task-definition.outputs.task_definition }}" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[].{name:name,image:image}' \
            --output json || true

      - name: Verify database-aware API readiness
        env:
          API_HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL || 'https://api.ayurpass.com/health/ready' }}
        run: |
          echo "Checking $API_HEALTHCHECK_URL"
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$API_HEALTHCHECK_URL")"
          echo "$response"
          echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'
