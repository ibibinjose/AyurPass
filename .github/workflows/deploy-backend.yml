name: Deploy Backend to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: ayurpass-backend
  ECS_CLUSTER: ayurpass
  ECS_SERVICE: ayurpass-api
  TASK_FAMILY: ayurpass-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        working-directory: apps/api
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
          echo "ECS deployment is stable."

      - name: Verify database-aware API readiness
        env:
          API_HEALTHCHECK_URL: ${{ vars.API_HEALTHCHECK_URL || 'https://api.ayurpass.com/health/ready' }}
        run: |
          echo "Checking $API_HEALTHCHECK_URL"
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$API_HEALTHCHECK_URL")"
          echo "$response"
          echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"'
