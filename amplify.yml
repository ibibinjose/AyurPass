version: 1
applications:
  - appRoot: frontend
    framework: nextjs
    frontend:
      phases:
        preBuild:
          commands:
            # Ensure Node.js 20+ is used for Next.js/React compatibility
            - nvm use 20 || nvm install 20
            # Go up to the root, install all monorepo dependencies, and link workspaces
            - cd .. && npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - .next/cache/**/*
