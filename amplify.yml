version: 1
applications:
  - appRoot: apps/dashboard
    framework: nextjs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            # Install monorepo workspaces from repo root
            - cd ../.. && npm ci
        build:
          commands:
            - cd ../.. && npm run build -w @ayurpass/dashboard
      artifacts:
        # Paths are relative to appRoot (apps/dashboard)
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
