# Canonical workflow lives next to the Expo app:
#   apps/mobile/.eas/workflows/create-production-builds.yml
#
# Run from the mobile app:
#   cd apps/mobile && eas workflow:run create-production-builds.yml

name: Create Production Builds

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Android production
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: iOS production
    type: build
    params:
      platform: ios
      profile: production
