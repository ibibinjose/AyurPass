version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        # monorepo root is two levels up from apps/dashboard
        - cd ../.. && npm ci
    build:
      commands:
        - cd ../.. && npm run build -w @ayurpass/dashboard
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - .next/cache/**/*
