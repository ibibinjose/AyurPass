version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - |
          set -e
          find_root() {
            d="$(pwd)"
            while [ "$d" != "/" ]; do
              if [ -f "$d/package.json" ] && grep -q '"name": "ayurpass"' "$d/package.json" 2>/dev/null; then
                echo "$d"
                return 0
              fi
              d="$(dirname "$d")"
            done
            if [ -f ../../package.json ]; then (cd ../.. && pwd); else pwd; fi
          }
          ROOT="$(find_root)"
          cd "$ROOT"
          npm ci
    build:
      commands:
        - |
          set -e
          find_root() {
            d="$(pwd)"
            while [ "$d" != "/" ]; do
              if [ -f "$d/package.json" ] && grep -q '"name": "ayurpass"' "$d/package.json" 2>/dev/null; then
                echo "$d"
                return 0
              fi
              d="$(dirname "$d")"
            done
            if [ -f ../../package.json ]; then (cd ../.. && pwd); else pwd; fi
          }
          ROOT="$(find_root)"
          cd "$ROOT"
          npm run build -w @ayurpass/dashboard
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - .next/cache/**/*
